services:
  database.server:
    image: "mcr.microsoft.com/mssql/server:2022-latest"
    container_name: database.server
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=y
      - SA_PASSWORD="LLmRkvMrZr@Ye8R"
    volumes:
      - ./sqlserver/data:/var/opt/mssql/data
      - ./sqlserver/log:/var/opt/mssql/log
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U SA -P "LLmRkvMrZr@Ye8R" -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"

  products.presentation:
    container_name: products.api
    build:
      context: .
      dockerfile: src/services/Products/Products.Presentation/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=3000
      - ASPNETCORE_HTTPS_PORTS=3001
      - ASPNETCORE_Kestrel__Certificates__Default__Password=123
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/Products.pfx
      - DOCKER_USERNAME=zhubinshahyad
      - DOCKER_PASSWORD=LLmRkvMrZr@YE8R
    ports:
      - "10001:80"
    volumes:
      - ~/.aspnet/https:/https:ro
    depends_on:
      database.server:
        condition: service_healthy

  news.presentation:
    container_name: news.api
    build:
      context: .
      dockerfile: src/services/News/News.Presentation/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=3002
      - ASPNETCORE_HTTPS_PORTS=3003
      - ASPNETCORE_Kestrel__Certificates__Default__Password=123
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/News.pfx
      - DOCKER_USERNAME=zhubinshahyad
      - DOCKER_PASSWORD=LLmRkvMrZr@YE8R
    ports:
      - "1002:80"
    volumes:
      - ~/.aspnet/https:/https:ro
    depends_on:
      database.server:
        condition: service_healthy
