version: '3.4'

services:

  database.server:
    image: "mcr.microsoft.com/mssql/server:2022-latest"
    container_name: database.server
    environment:
      - ACCEPT_EULA=y
      - SA_PASSWORD=LLmRkvMrZr@Ye8R
    restart: always
    ports:
      - "1433:1433"
    volumes:
      - ./sqlserver/data:/var/opt/mssql/data
      - ./sqlserver/log:/var/opt/mssql/log

  rabbitmq:
    container_name: rabbitmq
    restart: always
    ports:
        - "5672:5672"
        - "15672:15672"
      
  products.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "10000:8083"
    depends_on:
      - database.server

  news.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "10001:8082"


  education.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "10002:8081"

  gallery.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "10004:8084"
  contact.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "10007:8086"

